// Copie de la page chiffree, prise avant tout dechiffrement. Elle survit a document.write
// parce quelle est posee sur window : le bouton « Copie locale » la ressert telle quelle,
// donc un fichier partage reste protege par le mot de passe.
try{window.__KAMALYSE_CHIFFRE="<!doctype html>\n"+document.documentElement.outerHTML;}catch(x){}
function u8(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function b64(b){var s="",a=new Uint8Array(b);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
// On ne retient jamais le mot de passe lui-meme, seulement la cle quil derive.
async function bits(mdp){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(SEL),iterations:310000,hash:"SHA-256"},base,256);
}
// On dechiffre dabord, on enregistre ensuite, on remplace la page en dernier :
// une fois document.write appele, le formulaire nexiste plus et la case a cocher non plus.
async function dechiffrer(bt){
  var cle=await crypto.subtle.importKey("raw",bt,{name:"AES-GCM"},false,["decrypt"]);
  var clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},cle,u8(D));
  return new TextDecoder().decode(clair);
}
function afficher(html){document.open();document.write(html);document.close();}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var b=document.getElementById("b"),e=document.getElementById("e");
  var rester=document.getElementById("r").checked;
  b.disabled=true;e.textContent="";
  try{
    var bt=await bits(document.getElementById("p").value);
    var html=await dechiffrer(bt);
    try{(rester?localStorage:sessionStorage).setItem(K,b64(bt));}catch(x){}
    afficher(html);
  }catch(err){
    e.textContent="Mot de passe incorrect";b.disabled=false;
    document.getElementById("p").select();
  }
});
// Reouverture silencieuse si une cle valide a ete gardee sur cet appareil.
(async function(){
  var g;try{g=localStorage.getItem(K)||sessionStorage.getItem(K);}catch(x){}
  if(!g)return;
  try{afficher(await dechiffrer(u8(g)));}catch(err){
    try{localStorage.removeItem(K);sessionStorage.removeItem(K);}catch(x){}
  }
})();
