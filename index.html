  return crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(SEL),iterations:310000,hash:"SHA-256"},base,256);
}
// On dechiffre d abord, on enregistre ensuite, on remplace la page en dernier :
// une fois document.write appele, le formulaire n existe plus et la case a cocher non plus.
async function dechiffrer(bt){
  var cle=await crypto.subtle.importKey("raw",bt,{name:"AES-GCM"},false,["decrypt"]);
  var clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},cle,u8(D));
  return new TextDecoder().decode(clair);
}
function afficher(html){document.open();document.write(html);document.close();}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var b=document.getElementById("b"),e=document.getElementById("e");
  var rester=document.getElementById("r").checked;
  b.disabled=true;e.textContent="";
  try{
    var bt=await bits(document.getElementById("p").value);
    var html=await dechiffrer(bt);
    try{(rester?localStorage:sessionStorage).setItem(K,b64(bt));}catch(x){}
    afficher(html);
  }catch(err){
    e.textContent="Mot de passe incorrect";b.disabled=false;
    document.getElementById("p").select();
  }
});
